name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Offline fee seed
        run: uv run python main.py refresh-fees --offline
      - name: Run test suite
        run: uv run python main.py test
      - name: Offline demo
        run: |
          uv run python main.py demo
          test -f data/demo/dashboard.html
