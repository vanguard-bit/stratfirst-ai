[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .venv .git __pycache__ data .pytest_cache
markers =
    phase0: implemented — fees, friction, config, meta rules, env
    phase1: order model + ledger events
    phase2: exchange simulator (circuits, sessions)
    phase3: broker simulator (MIS square-off, RMS)
    phase4: unified pipeline
    phase5: data ingest + backfill
    phase6: strategy implementations
    phase6b: LLM feature extraction
    phase7: backtest runner
    phase8: forward paper + recovery
    runtime: operational checks — logs, strategy integrity, allocator diversity
addopts = -ra --strict-markers
