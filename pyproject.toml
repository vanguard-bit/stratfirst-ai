[project]
name = "stratfirst-ai"
version = "0.1.0"
description = "Strategy-first NSE paper-trading research lab (no live broker orders)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1.0",
  "pyarrow>=18.0.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.2",
  "requests>=2.31.0,<3",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
  "python-dateutil>=2.9.0",
  "streamlit>=1.40.0",
  "nse-archives>=1.1.0",
  "cloudscraper>=1.2.71",
  "yfinance>=0.2.40",
  "fyers-apiv3>=3.1.0",
  "pytest>=8.0.0",
  "lightgbm>=4.0.0",
  "pyotp>=2.9.0",
  "mcp>=1.2,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
